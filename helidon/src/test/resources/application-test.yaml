server:
  features:
    observe:
      observers:
        metrics: {}
        tracing: {}

telemetry:
  service: helidon-test
  global: false
  signals:
    logging:
      enabled: true
      processors:
        - type: simple
          exporters:
            - otlp-log
      exporters:
        - name: otlp-log
          type: logging_otlp
    metrics:
      exporters:
        - name: otlp-log
          type: logging_otlp
      readers:
        - type: periodic
          exporter: otlp-log
          interval: PT1S

app:
  fruit:
    repository:
      delegate: "jpa"

data:
  sources:
    sql:
      - name: "fruitstore"
        provider.hikari:
          url: "jdbc:h2:mem:test;DB_CLOSE_DELAY=-1"
          username: "sa"
          password: ""
  persistence-units:
    jakarta:
      - data-source: "fruitstore"
        init-script: "init.sql"
        drop-script: "drop.sql"
        properties:
          jakarta.persistence.schema-generation.database.action: "none"
